# Static server for Kasku. Runs as non-root on :8080 (nginx-unprivileged image).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    types { application/manifest+json webmanifest; }
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Common security headers (re-declared in each location because add_header does not inherit).
    set $sec_referrer "strict-origin-when-cross-origin";

    # Landing page: Google Fonts + GSAP from cdnjs, one inline script (enhancement) and JSON-LD.
    location = / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy $sec_referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files /index.html =404;
    }

    # The app itself: nothing but its own origin. This is what backs "data never leaves the phone".
    location /app/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /app/index.html;
    }

    # Service worker must always be revalidated so updates roll out.
    location = /app/sw.js {
        add_header Cache-Control "no-store" always;
        add_header Service-Worker-Allowed "/app/" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ /\. { deny all; }
}
